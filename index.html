<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Collaborative Property Checklist</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f3f4f6;
    padding:20px;
}

.container{
    max-width:950px;
    margin:auto;
    background:white;
    padding:24px;
    border-radius:18px;
    box-shadow:0 10px 25px rgba(0,0,0,0.08);
}

h1{
    text-align:center;
    margin-bottom:10px;
    color:#111827;
}

.note{
    text-align:center;
    color:#6b7280;
    margin-bottom:25px;
    font-size:14px;
}

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin-bottom:12px;
}

input{
    padding:12px;
    border:1px solid #d1d5db;
    border-radius:10px;
    font-size:14px;
}

.full{
    grid-column:1/-1;
}

button{
    width:100%;
    padding:13px;
    border:none;
    border-radius:10px;
    background:#2563eb;
    color:white;
    font-size:15px;
    cursor:pointer;
    transition:0.2s;
}

button:hover{
    background:#1d4ed8;
}

.card{
    background:#f9fafb;
    padding:18px;
    border-radius:16px;
    margin-top:18px;
    border:1px solid #e5e7eb;
}

.top{
    display:flex;
    gap:12px;
}

.content{
    flex:1;
}

.property{
    font-size:18px;
    font-weight:700;
    margin-bottom:14px;
    color:#111827;
}

.details{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
}

.detail{
    background:white;
    padding:10px;
    border-radius:10px;
    border:1px solid #dbe2ea;
}

.label{
    font-size:12px;
    color:#6b7280;
    margin-bottom:5px;
}

.delete-btn{
    margin-top:15px;
    background:#ef4444;
}

.delete-btn:hover{
    background:#dc2626;
}

@media(max-width:700px){

    .form-grid{
        grid-template-columns:1fr;
    }

    .details{
        grid-template-columns:1fr;
    }

}

</style>

</head>
<body>

<div class="container">

    <h1>Property Checklist</h1>

    <div class="note">
        Shared live property tracker.
    </div>

    <!-- FORM -->

    <div class="form-grid">

        <input 
            type="text" 
            id="property"
            class="full"
            placeholder="Property Name & Location"
        >

        <input 
            type="text" 
            id="name"
            placeholder="Contact Name"
        >

        <input 
            type="text" 
            id="role"
            placeholder="Role (Builder / Broker / Owner)"
        >

        <input 
            type="text" 
            id="phone"
            class="full"
            placeholder="Phone Number"
        >

    </div>

    <button onclick="addProperty()">
        Add Property
    </button>

    <!-- LIST -->

    <div id="list"></div>

</div>

<script type="module">

// FIREBASE IMPORTS

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

import {

    getFirestore,
    collection,
    addDoc,
    onSnapshot,
    deleteDoc,
    doc

}
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


// YOUR FIREBASE CONFIG

const firebaseConfig = {

    apiKey: "AIzaSyACIQ6aeKDhQ1XdrA-JMbwlrmnz3dJdkwU",

    authDomain: "property-checklist-2795e.firebaseapp.com",

    projectId: "property-checklist-2795e",

    storageBucket: "property-checklist-2795e.firebasestorage.app",

    messagingSenderId: "743307911285",

    appId: "1:743307911285:web:37e41c22514ecb482a983c"

};


// INITIALIZE FIREBASE

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

const list = document.getElementById("list");


// ADD PROPERTY

window.addProperty = async function(){

    const property = document.getElementById("property").value.trim();

    const name = document.getElementById("name").value.trim();

    const role = document.getElementById("role").value.trim();

    const phone = document.getElementById("phone").value.trim();

    if(property === ""){

        alert("Please enter property name.");

        return;

    }

    await addDoc(collection(db, "properties"), {

        property,
        name,
        role,
        phone,
        createdAt: Date.now()

    });

    // CLEAR FORM

    document.getElementById("property").value = "";

    document.getElementById("name").value = "";

    document.getElementById("role").value = "";

    document.getElementById("phone").value = "";

};


// LIVE REALTIME SYNC
onSnapshot(collection(db, "properties"), (snapshot) => {

    list.innerHTML = "";

    snapshot.forEach((docItem) => {

        const data = docItem.data();

        list.innerHTML += `

            <div class="card">

                <div class="top">

                    <input 
                        type="checkbox"
                        ${data.completed ? "checked" : ""}
                        onchange="toggleComplete(
                            '${docItem.id}',
                            this.checked
                        )"
                        style="
                            width:20px;
                            height:20px;
                            margin-top:5px;
                            cursor:pointer;
                        "
                    >

                    <div class="content">

                        <div 
                            class="property"
                            style="
                                ${data.completed 
                                    ? 'text-decoration:line-through;opacity:0.6;' 
                                    : ''}
                            "
                        >
                            ${data.property}
                        </div>

                        <div class="details">

                            <div class="detail">

                                <div class="label">
                                    Name
                                </div>

                                <div>
                                    ${data.name || "-"}
                                </div>

                            </div>

                            <div class="detail">

                                <div class="label">
                                    Role
                                </div>

                                <div>
                                    ${data.role || "-"}
                                </div>

                            </div>

                            <div class="detail">

                                <div class="label">
                                    Phone
                                </div>

                                <div>
                                    ${data.phone || "-"}
                                </div>

                            </div>

                        </div>

                        <button
                            class="delete-btn"
                            onclick="deleteProperty('${docItem.id}')"
                        >
                            Delete
                        </button>

                    </div>

                </div>

            </div>

        `;

    });

});


// DELETE PROPERTY

window.deleteProperty = async function(id){

    await deleteDoc(doc(db, "properties", id));

};

import {
    updateDoc
}
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

window.toggleComplete = async function(id, completed){

    await updateDoc(doc(db, "properties", id), {

        completed: completed

    });

};

</script>

</body>
</html>
